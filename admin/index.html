<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Hilos de Coral</title>
<meta name="theme-color" content="#1B3F66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin HC">
<link rel="icon" type="image/png" href="../img/admin-favicon-32.png">
<link rel="apple-touch-icon" href="../img/admin-apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css?v=1.6.1">
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral">
    <div class="lateral-marca">
      <img src="../img/admin-icono-192.png" alt="" width="44" height="44">
      <div>
        <span class="lateral-nombre" id="lateral-nombre">Hilos de Coral</span>
        <span class="lateral-sub">Panel de la tienda</span>
      </div>
    </div>
    <nav class="lateral-nav" id="nav" aria-label="Secciones">
      <button type="button" data-seccion="inicio">Inicio</button>
      <button type="button" data-seccion="productos">Productos</button>
      <button type="button" data-seccion="categorias">Categorías</button>
      <button type="button" data-seccion="entregas">Entregas y envíos</button>
      <button type="button" data-seccion="pagos">Formas de pago</button>
      <button type="button" data-seccion="paginas">Páginas y políticas</button>
      <button type="button" data-seccion="tienda">Datos de la tienda</button>
      <button type="button" data-seccion="conexion">Conexión con GitHub</button>
      <button type="button" data-seccion="copias">Copias de seguridad</button>
    </nav>
    <a class="lateral-ver" href="../" target="_blank" rel="noopener">Ver la tienda ↗</a>
    <span class="lateral-version" id="lateral-version">v1.6.1</span>
  </aside>

  <div class="principal">
    <header class="barra">
      <button type="button" class="boton-menu" id="boton-menu" aria-label="Abrir menú" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="barra-titulo" id="barra-titulo">Inicio</h1>
      <div class="barra-estado" id="barra-estado" role="status" aria-live="polite"></div>
      <button type="button" class="btn btn-coral" id="publicar" disabled>Guardar y publicar</button>
    </header>
    <main class="contenido" id="contenido" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>
</div>

<dialog class="modal" id="modal" aria-labelledby="modal-titulo">
  <form method="dialog" class="modal-caja" id="modal-caja" novalidate></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/comun.js?v=1.6.1"></script>
<script src="../js/github.js?v=1.6.1"></script>
<script src="../js/admin.js?v=1.6.1"></script>
</body>
</html>
